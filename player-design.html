<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamku Player — Design Mockup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #e50914; margin-top: -5px; opacity: 0; transition: opacity 0.15s; }
    input[type="range"]:hover::-webkit-slider-thumb { opacity: 1; }

    .player { position: relative; flex: 1; background: #000; user-select: none; }
    .player video, .player .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    /* ── Top Bar ───────────────────────────────────────────── */
    .top-bar { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 18px; padding: 20px 24px; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); z-index: 10; }
    .top-bar .back-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); transition: background 0.15s; flex-shrink: 0; }
    .top-bar .back-btn:hover { background: rgba(255,255,255,0.2); }
    .top-bar .back-btn svg { width: 22px; height: 22px; }
    .top-bar .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Bottom Controls ───────────────────────────────────── */
    .controls-layer { position: absolute; inset: auto 0 0 0; z-index: 10; }
    .controls-bg { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%); pointer-events: none; }

    /* ── Progress Bar ──────────────────────────────────────── */
    .progress-container { position: relative; padding: 0 24px; height: 44px; display: flex; align-items: flex-end; padding-bottom: 6px; cursor: pointer; z-index: 2; }
    .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; transition: height 0.15s; }
    .progress-container:hover .progress-track { height: 7px; }
    .progress-buffered { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255,255,255,0.25); border-radius: 2px; width: 45%; }
    .progress-played { position: absolute; left: 0; top: 0; height: 100%; background: #e50914; border-radius: 2px; width: 30%; }
    .progress-thumb { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #e50914; transform: translate(-50%, -50%); left: 30%; box-shadow: 0 0 8px rgba(229,9,20,0.6); opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .progress-container:hover .progress-thumb { opacity: 1; }
    .progress-tooltip { position: absolute; bottom: 100%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; margin-bottom: 10px; left: 30%; }
    .progress-container:hover .progress-tooltip { opacity: 1; }


    /* ── Control Bar ───────────────────────────────────────── */
    .control-bar { display: flex; align-items: center; gap: 10px; padding: 0 24px 20px; position: relative; z-index: 2; }

    .control-bar .play-main { width: 52px; height: 52px; background: #e50914; border-radius: 50%; }
    .control-bar .play-main:hover { background: #f40612; }
    .control-bar .play-main svg { width: 28px; height: 28px; }

    .control-bar .btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.15s; flex-shrink: 0; }
    .control-bar .btn:hover { background: rgba(255,255,255,0.12); }
    .control-bar .btn svg { width: 24px; height: 24px; }
    .time { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.85); white-space: nowrap; padding: 0 6px; }
    .time .current { color: #fff; }
    .time .separator { margin: 0 3px; color: rgba(255,255,255,0.4); }
    .spacer { flex: 1; }

    /* ── Volume ────────────────────────────────────────────── */
    .volume-group { display: flex; align-items: center; justify-content: center; }
    .volume-slider-wrap { width: 0; overflow: hidden; transition: width 0.2s ease; display: flex; align-items: center; padding-left: 0; }
    .volume-group:hover .volume-slider-wrap { width: 120px; padding-left: 8px; }
    .vol-track { position: relative; width: 100px; height: 16px; cursor: pointer; }
    .vol-rail { position: absolute; top: 50%; left: 0; right: 0; height: 4px; border-radius: 2px; background: #333; transform: translateY(-50%); }
    .vol-fill { position: absolute; top: 50%; left: 0; height: 4px; border-radius: 2px; background: #fff; width: 70%; transform: translateY(-50%); pointer-events: none; }
    .vol-dot { position: absolute; top: 50%; left: 70%; width: 10px; height: 10px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 1px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 1; }

    /* ── Speed Badge ───────────────────────────────────────── */
    .speed-badge { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 7px; background: rgba(255,255,255,0.1); transition: background 0.15s; letter-spacing: 0.02em; }
    .speed-badge:hover { background: rgba(255,255,255,0.2); }

    /* ── Settings Popover ──────────────────────────────────── */
    .settings-popover { position: absolute; bottom: 100%; right: 16px; margin-bottom: 12px; background: rgba(18,18,18,0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 10px 0; min-width: 210px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
    .settings-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .settings-popover .option { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; font-size: 15px; color: rgba(255,255,255,0.7); transition: background 0.1s; width: 100%; text-align: left; }
    .settings-popover .option:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .settings-popover .option .label { color: rgba(255,255,255,0.4); font-size: 13px; }
    .settings-popover .option .active { color: #e50914; font-weight: 600; }
    .settings-popover .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }
    .speed-options { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 18px 10px; }
    .speed-option { padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); transition: background 0.1s, color 0.1s; }
    .speed-option:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .speed-option.active { background: rgba(229,9,20,0.2); color: #e50914; }

    /* ── Episode Nav ───────────────────────────────────────── */
    .episode-nav { position: absolute; bottom: 100px; left: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
    .ep-btn { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; transition: background 0.15s, border-color 0.15s; }
    .ep-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
    .ep-btn .ep-info { display: flex; flex-direction: column; gap: 2px; text-align: left; }
    .ep-btn .ep-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.4); }
    .ep-btn .ep-name { font-size: 15px; font-weight: 600; color: #fff; }
    .ep-btn svg { width: 22px; height: 22px; flex-shrink: 0; color: rgba(255,255,255,0.5); }

    /* ── Next Episode Pill (right) ──────────────────────────── */
    .next-ep-pill { position: absolute; bottom: 100px; right: 24px; z-index: 10; }

    /* ── Design Label ──────────────────────────────────────── */
    .design-label { position: fixed; top: 12px; right: 12px; background: rgba(229,9,20,0.15); border: 1px solid rgba(229,9,20,0.3); border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 700; color: #e50914; letter-spacing: 0.05em; z-index: 100; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="design-label">Streamku Player — Design v1</div>

  <div class="player" id="player">
    <!-- Backdrop -->
    <img class="poster" src="https://image.tmdb.org/t/p/w1280/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg" alt="">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="title">Iron Man</span>
    </div>

    <!-- Episode Nav -->
    <div class="episode-nav">
      <button class="ep-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <div class="ep-info">
          <span class="ep-label">Previous</span>
          <span class="ep-name">S1 E2 — Behind the Mask</span>
        </div>
      </button>
    </div>

    <button class="ep-btn next-ep-pill">
      <div class="ep-info">
        <span class="ep-label">Next</span>
        <span class="ep-name">S1 E4 — Stark Industries</span>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <!-- Bottom Controls -->
    <div class="controls-layer">
      <div class="controls-bg"></div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-tooltip" id="progressTooltip">0:45:12</div>
        <div class="progress-track">
          <div class="progress-buffered"></div>
          <div class="progress-played" id="progressPlayed"></div>
          <div class="progress-thumb" id="progressThumb"></div>

        </div>
      </div>

      <div class="control-bar">
        <button class="btn" title="Rewind 10s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>

        <button class="btn play-main" id="barPlayBtn">
          <svg viewBox="0 0 24 24" fill="white" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg>
        </button>

        <button class="btn" title="Forward 10s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>

        <div class="volume-group">
          <button class="btn" id="volumeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <div class="volume-slider-wrap">
            <div class="vol-track" id="volTrack">
              <div class="vol-rail"></div>
              <div class="vol-fill" id="volFill"></div>
              <div class="vol-dot" id="volDot"></div>
            </div>
          </div>
        </div>

        <span class="time">
          <span class="current" id="timeCurrent">0:45:12</span>
          <span class="separator">/</span>
          <span class="total">2:26:00</span>
        </span>

        <div class="spacer"></div>

        <button class="btn" title="Subtitles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="18" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/></svg>
        </button>

        <button class="speed-badge" id="speedBtn">1x</button>

        <div style="position:relative;">
          <button class="btn" id="settingsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="settings-popover" id="settingsPopover">
            <button class="option">
              <span>Quality</span>
              <span class="label active">1080p</span>
            </button>
            <div class="divider"></div>
            <button class="option"><span>Speed</span></button>
            <div class="speed-options">
              <button class="speed-option">0.5x</button>
              <button class="speed-option">0.75x</button>
              <button class="speed-option active">1x</button>
              <button class="speed-option">1.25x</button>
              <button class="speed-option">1.5x</button>
              <button class="speed-option">2x</button>
            </div>
            <div class="divider"></div>
            <button class="option">
              <span>Subtitles</span>
              <span class="label">Off</span>
            </button>
            <div class="divider"></div>
            <button class="option">
              <span>Audio Track</span>
              <span class="label">English</span>
            </button>
          </div>
        </div>

        <button class="btn" title="Mini Player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="9" width="8" height="6" rx="1"/></svg>
        </button>

        <button class="btn" title="Theater Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="2" y1="7" x2="22" y2="7"/><line x1="2" y1="17" x2="22" y2="17"/></svg>
        </button>

        <button class="btn" title="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let muted = false;
    const volSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    const volMutedSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      muted = !muted;
      volumeBtn.innerHTML = muted ? volMutedSvg : volSvg;
    });

    const volTrack = document.getElementById('volTrack');
    const volFill = document.getElementById('volFill');
    const volDot = document.getElementById('volDot');
    let volDragging = false;

    function setVolFromEvent(e) {
      const rect = volTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      volFill.style.width = pct + '%';
      volDot.style.left = pct + '%';
    }
    volTrack.addEventListener('mousedown', (e) => { volDragging = true; setVolFromEvent(e); });
    document.addEventListener('mousemove', (e) => { if (volDragging) setVolFromEvent(e); });
    document.addEventListener('mouseup', () => { volDragging = false; });
    const progressPlayed = document.getElementById('progressPlayed');
    const progressThumb = document.getElementById('progressThumb');
    const progressTooltip = document.getElementById('progressTooltip');
    const progressContainer = document.getElementById('progressContainer');
    const timeCurrent = document.getElementById('timeCurrent');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPopover = document.getElementById('settingsPopover');
    const barPlayBtn = document.getElementById('barPlayBtn');
    const playIcon = document.getElementById('playIcon');

    let playing = true;
    let scrubbing = false;

    function togglePlay() {
      playing = !playing;
      if (playing) {
        playIcon.innerHTML = '<polygon points="8,5 19,12 8,19" fill="white"/>';
      } else {
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1" fill="white"/><rect x="14" y="4" width="4" height="16" rx="1" fill="white"/>';
      }
    }
    barPlayBtn.addEventListener('click', togglePlay);

    function scrub(e) {
      const rect = progressContainer.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      progressPlayed.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      progressTooltip.style.left = pct + '%';
      const totalSec = 8760;
      const sec = Math.floor(totalSec * pct / 100);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const ts = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      progressTooltip.textContent = ts;
      timeCurrent.textContent = ts;
    }
    progressContainer.addEventListener('mousedown', (e) => { scrubbing = true; scrub(e); });
    document.addEventListener('mousemove', (e) => { if (scrubbing) scrub(e); });
    document.addEventListener('mouseup', () => { scrubbing = false; });

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsPopover.classList.toggle('open');
    });
    document.addEventListener('click', () => settingsPopover.classList.remove('open'));
  </script>
</body>
</html>
